# Add these under dev_dependencies:
flutter_launcher_icons: ^0.14.4
flutter_native_splash: ^2.4.6

# Add these at the root of pubspec.yaml:
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/nizik_icon_1024.png"
  adaptive_icon_background: "#043D2E"
  adaptive_icon_foreground: "assets/branding/nizik_icon_foreground_1024.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#043D2E"
  image: "assets/branding/nizik_splash_logo_1024.png"
  android: true
  ios: true

  android_12:
    color: "#043D2E"
    image: "assets/branding/nizik_splash_logo_1024.png"
    icon_background_color: "#043D2E"
