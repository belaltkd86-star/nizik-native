workflows:
  ios-unsigned:
    name: Nizik iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter packages
        script: |
          flutter clean
          flutter pub get

      - name: Build iOS without signing
        script: |
          flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        script: |
          rm -rf build/ios/unsigned_ipa
          mkdir -p build/ios/unsigned_ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned_ipa/Payload/
          cd build/ios/unsigned_ipa
          zip -r Nizik-unsigned.ipa Payload

    artifacts:
      - build/ios/unsigned_ipa/Nizik-unsigned.ipa
