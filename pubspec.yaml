name: nizik_native
description: "نزیک - دۆزینەوەی دووکان، خزمەتگوزاری و بازاڕی نزیک."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  shared_preferences: ^2.5.5
  app_links: ^7.2.1
  flutter_map_marker_cluster: 8.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/nizik_icon_1024.png"
  adaptive_icon_background: "#043D2E"
  adaptive_icon_foreground: "assets/branding/nizik_icon_foreground_1024.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#043D2E"
  image: "assets/branding/nizik_splash_logo_1024.png"
  android: true
  ios: true
  android_12:
    color: "#043D2E"
    image: "assets/branding/nizik_splash_logo_1024.png"
    icon_background_color: "#043D2E"
